services:
  - type: web
    name: diskoko
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_GATEWAY_MODE
        value: external
      - key: DISCORD_REST_MODE
        value: worker
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: BASE_URL
        value: https://diskoko.com
      - key: FRONTEND_URL
        value: https://diskoko.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: ADMIN_DISCORD_IDS
        sync: false
      # Keep runtime credentials independent from the managed schema-owner login.
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA_MODE
        value: external
      - key: DB_TLS_MODE
        value: pinned
      - key: DB_TLS_PIN_HOST
        fromDatabase:
          name: dickoko-db
          property: host
      - key: DB_TLS_CA
        sync: false
  - type: worker
    name: diskoko-bot-worker
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm run bot:worker
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_GATEWAY_MODE
        value: worker
      # Keep runtime credentials independent from the managed schema-owner login.
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA_MODE
        value: external
      - key: DB_TLS_MODE
        value: pinned
      - key: DB_TLS_PIN_HOST
        fromDatabase:
          name: dickoko-db
          property: host
      - key: DB_TLS_CA
        sync: false
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: diskoko
          envVarKey: ENCRYPTION_KEY
      - key: DISCORD_BOT_TOKEN
        fromService:
          type: web
          name: diskoko
          envVarKey: DISCORD_BOT_TOKEN
      - key: AI_WORKER_TOKEN
        fromService:
          type: web
          name: diskoko
          envVarKey: AI_WORKER_TOKEN
databases:
  - name: dickoko-db
    plan: 0.1c-256mb
    ipAllowList: []
