name: Audit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: diskoko_test
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: diskoko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diskoko_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESOURCE_TEST_DATABASE_URL: postgresql://diskoko_test:disposable-test-only@localhost:5432/diskoko_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run audit:all
      - run: npm audit --omit=dev --audit-level=high
