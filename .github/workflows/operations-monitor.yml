name: Operations watchdog
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a labelled test notification to the configured operations destinations
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: production-operations-watchdog
  cancel-in-progress: false
jobs:
  observe:
    if: vars.OPS_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - name: Find previous observation
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({owner:context.repo.owner,repo:context.repo.repo,workflow_id:'operations-monitor.yml',branch:context.payload.repository.default_branch,status:'completed',per_page:5});
            for (const run of data.workflow_runs) {
              const {data:artifacts} = await github.rest.actions.listWorkflowRunArtifacts({owner:context.repo.owner,repo:context.repo.repo,run_id:run.id});
              if (artifacts.artifacts.some(a => a.name==='operations-monitor-state' && !a.expired)) { core.setOutput('run',String(run.id));break; }
            }
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run != ''
        with:
          name: operations-monitor-state
          path: .operations-state
          run-id: ${{ steps.previous.outputs.run }}
          github-token: ${{ github.token }}
      - name: Observe production and deliver outage or recovery
        run: node scripts/operations-watchdog.mjs
        env:
          OPS_MONITOR_URL: https://diskoko.com
          OPS_MONITOR_TEST: ${{ inputs.test_alert && 'true' || 'false' }}
          OPS_ALERT_EMAILS: ${{ secrets.OPS_ALERT_EMAILS }}
          OPS_ALERT_CHANNEL_ID: ${{ secrets.OPS_ALERT_CHANNEL_ID }}
          OPS_ALERT_GUILD_ID: ${{ secrets.OPS_ALERT_GUILD_ID }}
          OPS_DISCORD_WEBHOOK_URL: ${{ secrets.OPS_DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.OPS_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.OPS_SMTP_PORT }}
          SMTP_USER: ${{ secrets.OPS_SMTP_USER }}
          SMTP_PASS: ${{ secrets.OPS_SMTP_PASS }}
          SMTP_FROM: ${{ secrets.OPS_SMTP_FROM }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-monitor-state
          path: .operations-state/state.json
          retention-days: 7
          if-no-files-found: warn
